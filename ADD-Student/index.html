<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

  <div>
      <h1 style="text-align: center;">Enter your Details</h1>
  </div>

    <div class="container">
       <div class="align-content-center ">
        
            <div class="p-5 col-md-5 m-0">

              <!-- Name & Address -->

              

                <form style="border: solid 0px; " >
                    <div class="form-group">
                      
                      <h2>Name And Address </h2>
                      <label for="Name">Name</label>
                      <input type="text" class="form-control" style="width: 301px;; height: 30px;" id="Name" placeholder="Name">
                    </div><br>
                    <div class="form-group">
                      <label for="Surname">Surname</label>
                      <input type="text" class="form-control" style="width: 283px; height: 30px;" id="Surname" placeholder="Surname">
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="Address">Addres</label>
                        <input type="Address" class="form-control" style="width: 293px; height: 30px;" id="Address" placeholder="Address">
                    </div>

                    <!-- <div class="form-group">
                      <label for="exampleFormControlTextarea1">Example textarea</label>
                      <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                    </div> -->
                  

                    <!-- male,female -->

                    <h2>Male And Female</h2>

                    <div class="form-check">
                        <input class="form-check-input"  type="radio" name="flexRadioDefault" id="flexRadioDefault1">
                        <label class="form-check-label" for="flexRadioDefault1">
                          Male
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
                        <label class="form-check-label" for="flexRadioDefault2">
                          Female
                        </label>
                      </div>

                      <!-- check -->

                      <h2>Your hobbyy </h2>

                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                        <label class="form-check-label" for="flexCheckDefault">
                          music
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
                        <label class="form-check-label" for="flexCheckChecked">
                          Dance
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                        <label class="form-check-label" for="flexCheckDefault">
                          Coding
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
                        <label class="form-check-label" for="flexCheckChecked">
                          Reading
                        </label>
                      </div>

                      <!-- State -->

                      <h2>Select your state</h2>

                      <div>
                        <select class="form-select" aria-label="Default select example">
                          <option selected>STATE</option>
                          <option value="1">Gujarat</option>
                          <option value="2">Assam</option>
                          <option value="3">Kerala</option>
                        </select>
                      </div>

                      <!-- submit -->

                      <h2>cheque and submit</h2>
                    <div>
                      <button type="submit" class="btn btn-default">Submit</button>
                    </div>
                  </form>
                </div>
            </div>

            
        </div>


    
    </div>

    
</body>
</html>
